name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m flake8 darkspectrax tests examples
      - run: python -m pytest -q -n 2 --cov=darkspectrax --cov-report=term
      - run: python -m darkspectrax examples/landau.toml --out artifacts/landau
