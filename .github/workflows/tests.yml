name: tests
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install flake8
      - run: python -m flake8 darkspectrax tests examples
  test:
    # self-hosted: never run fork code on our own machines
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, uwplasma-cpu]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - run: uv venv && uv pip install -e '.[test]'
      - run: uv run pytest -q -n 3 --cov=darkspectrax --cov-report=term
      - run: uv run python -m darkspectrax examples/landau.toml --out artifacts/landau
